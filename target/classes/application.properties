# ===== Base de données MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/patientportal?useSSL=false&serverTimezone=UTC
spring.datasource.username=db_user
# ⚠️ Remplace "" par ton mot de passe MySQL si tu en as un
spring.datasource.password=#5up3rC3ntury
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update  → auto-create/alter tables au démarrage
# validate → seulement valider (utiliser en production)
# create  → drop + recréer à chaque démarrage (dev uniquement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Server port =====
server.port=8080

# ===== Name of application =====
spring.application.name=patient-portal

# ===== Security ====
jwt.secret.key=mysupersecuresecretkeymysupersecuresecretkey
jwt.expiration.time=3600000
logging.level.org.springframework.security=DEBUG
