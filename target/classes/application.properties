# ===== Base de données MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/patientportal?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# ⚠️ Remplace "" par ton mot de passe MySQL si tu en as un
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update  → auto-create/alter tables au démarrage
# validate → seulement valider (utiliser en production)
# create  → drop + recréer à chaque démarrage (dev uniquement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Serveur =====
server.port=8080

# ===== Nom de l'application =====
spring.application.name=patient-portal
