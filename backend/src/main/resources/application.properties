# ===== Base de données MySQL =====
#spring.datasource.url=jdbc:mysql://localhost:3306/patientportal?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# ⚠️ Remplace "" par ton mot de passe MySQL si tu en as un
spring.datasource.password=nepali
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Server port =====
server.port=8080

# ===== time correction  =====
spring.datasource.url=jdbc:mysql://localhost:3306/patientportal?serverTimezone=America/New_York
spring.jackson.time-zone=America/New_York
spring.jpa.properties.hibernate.jdbc.time_zone=America/New_York


# ===== Name of application =====
spring.application.name=patient-portal

# ===== Security ====
jwt.secret.key=mysupersecuresecretkeymysupersecuresecretkey
jwt.expiration.time=3600000
logging.level.org.springframework.security=DEBUG

# ===== Default Admin Credentials =====
app.admin.username=admin
app.admin.password=admin123
app.admin.email=admin@maclogix.com

