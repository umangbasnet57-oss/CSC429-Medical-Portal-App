name: Java CI - Patient Appointment Unit Tests

on:
  push:
    branches: [ main, final_backend]
  pull_request:
    branches: [ main, final_backend]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pmbackend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
